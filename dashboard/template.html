<!doctype html>
<!--
  agent-primitives profiler - zero-dependency run dashboard, Xcode-Instruments style.
  Rendered from the trace spans a run emits (turn -> agent -> model/tool call).
  Two modes, one file: served live (SSE) it auto-updates in real time; opened as a static
  file it renders the embedded snapshot. The runtime injects the run payload at the sentinel
  further down. No server needed to view a static export, no build step, works offline.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-primitives · profiler</title>
    <script id="ap-payload" type="application/json">%%AGENT_PRIMITIVES_PAYLOAD%%</script>
    <style>
      :root {
        --bg: #0d0d10; --panel: #16161b; --panel2: #1c1c22; --border: #292930;
        --text: #eceef2; --muted: #8b8c96; --faint: #5b5c66;
        --green: #32d74b; --yellow: #ffd60a; --orange: #ff9f0a; --red: #ff453a;
        --blue: #0a84ff; --violet: #bf5af2; --teal: #40c8e0; --pink: #ff6482;
        --grid: #202027;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 13px; -webkit-font-smoothing: antialiased; }
      .topbar { display: flex; align-items: center; gap: 14px; padding: 11px 18px; border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, #1b1b21, #131318); position: sticky; top: 0; z-index: 10; }
      .brand { font-weight: 650; letter-spacing: -0.2px; } .brand .bolt { color: var(--orange); }
      .brand .sub { color: var(--faint); font-weight: 400; }
      .runid { color: var(--faint); font-family: var(--mono); font-size: 12px; }
      .spacer { flex: 1; }
      .live { display: none; align-items: center; gap: 6px; font-size: 11px; color: var(--green); font-family: var(--mono); }
      .live.on { display: flex; }
      .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.4s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(50,215,75,0.5); } 50% { opacity: 0.55; box-shadow: 0 0 0 5px rgba(50,215,75,0); } }
      .pill { font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
      .pill.ok { color: var(--green); border-color: color-mix(in oklab, var(--green), transparent 62%); }
      .pill.error { color: var(--red); border-color: color-mix(in oklab, var(--red), transparent 55%); }
      .pill.partial { color: var(--orange); border-color: color-mix(in oklab, var(--orange), transparent 55%); }

      .section { border-bottom: 1px solid var(--border); }
      .section > h2 { margin: 0; padding: 14px 18px 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; font-weight: 600; }

      /* Gauge row */
      .gauges { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 1px; background: var(--border); margin-top: 14px; border-top: 1px solid var(--border); }
      .gpanel { background: var(--panel); padding: 16px 18px 20px; display: flex; align-items: center; gap: 18px; }
      .gpanel .meta { min-width: 0; }
      .gpanel .title { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
      .gpanel .big { font-family: var(--mono); font-size: 34px; letter-spacing: -1px; line-height: 1; }
      .gpanel .big .u { font-size: 16px; color: var(--muted); margin-left: 3px; }
      .gpanel .subline { color: var(--faint); font-family: var(--mono); font-size: 12px; margin-top: 6px; }
      .gauge svg { display: block; }
      .needle { transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1); transform-origin: 100px 100px; }
      .donut-legend { display: flex; flex-direction: column; gap: 7px; }
      .donut-legend .li { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
      .donut-legend .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; align-self: center; }
      .donut-legend .nm { color: var(--text); } .donut-legend .val { color: var(--faint); font-family: var(--mono); margin-left: auto; }

      /* Over-time */
      .overtime { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); margin-top: 14px; }
      .otcard { background: var(--panel); padding: 14px 18px 16px; display: flex; gap: 16px; }
      .otcard .stat { flex: none; width: 118px; }
      .otcard .stat .t { font-size: 13px; margin-bottom: 8px; }
      .otcard .stat .r { color: var(--faint); font-size: 12px; font-family: var(--mono); line-height: 1.7; }
      .otcard .stat .r b { color: var(--text); font-weight: 500; }
      .otcard .chart { flex: 1; min-width: 0; } .otcard .chart svg { width: 100%; height: 92px; display: block; }

      /* Agent tracks */
      .tracks { margin-top: 6px; }
      .trk { display: flex; align-items: center; gap: 0; height: 40px; border-top: 1px solid #15151a; }
      .trk .lab { width: 200px; flex: none; padding-left: 18px; }
      .trk .lab .n { font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
      .trk .lab .n .dot { width: 8px; height: 8px; border-radius: 2px; }
      .trk .lab .s { color: var(--faint); font-family: var(--mono); font-size: 10.5px; margin-left: 15px; }
      .trk .spark { flex: 1; min-width: 0; padding-right: 18px; } .trk .spark svg { width: 100%; height: 30px; display: block; }

      /* Timeline waterfall */
      .twrap { overflow-x: auto; padding-bottom: 8px; }
      .axis { position: relative; height: 22px; margin-left: 210px; border-bottom: 1px solid var(--border); }
      .axis .tick { position: absolute; top: 0; height: 100%; border-left: 1px solid var(--grid); }
      .axis .tick span { position: absolute; top: 4px; left: 5px; color: var(--faint); font-family: var(--mono); font-size: 10px; }
      .row { position: relative; height: 26px; border-bottom: 1px solid #131318; }
      .row:hover { background: #14141a; }
      .row .label { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; z-index: 2; pointer-events: none; text-shadow: 0 0 6px var(--bg); }
      .row .label .dot { width: 7px; height: 7px; border-radius: 2px; flex: none; }
      .row .label .rl { color: var(--faint); font-family: var(--mono); font-size: 10.5px; }
      .lane { position: absolute; top: 0; right: 0; bottom: 0; }
      .bar { position: absolute; top: 6px; height: 14px; border-radius: 3px; cursor: pointer; min-width: 2px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); transition: left 0.3s, width 0.3s; }
      .bar:hover { filter: brightness(1.25); } .bar.sel { box-shadow: 0 0 0 2px var(--text); }
      .bar.k-turn { background: #3a3a44; } .bar.k-agent { background: linear-gradient(180deg,#0a84ff,#0768cc); }
      .bar.k-model_call { background: linear-gradient(180deg,#32d74b,#25a83a); } .bar.k-tool_call { background: linear-gradient(180deg,#ff9f0a,#d98200); }
      .bar.k-a2a_call { background: linear-gradient(180deg,#40c8e0,#2c9fb3); }
      .bar.status-error { background: linear-gradient(180deg,#ff453a,#cc352c) !important; }
      .bar.status-partial { background: repeating-linear-gradient(45deg,#ff9f0a,#ff9f0a 4px,#b8730a 4px,#b8730a 8px) !important; }
      .bar .bl { position: absolute; left: 6px; right: 6px; line-height: 14px; font-family: var(--mono); font-size: 10px; color: rgba(0,0,0,0.72); font-weight: 600; overflow: hidden; white-space: nowrap; }

      .details { margin: 0 18px 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: none; }
      .details.on { display: block; }
      .details .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 18px; }
      .details .kv .k { color: var(--muted); font-size: 11px; } .details .kv .v { font-family: var(--mono); font-size: 12px; }
      .details .kv .v.green { color: var(--green); } .details .kv .v.red { color: var(--red); }
      .legend { display: flex; gap: 14px; padding: 8px 18px; font-size: 11px; color: var(--muted); }
      .legend .li { display: flex; align-items: center; gap: 6px; } .legend .dot { width: 9px; height: 9px; border-radius: 2px; }
      .foot { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
      .empty { color: var(--faint); padding: 40px 18px; text-align: center; }

      /* Evals */
      .evals-top { display: grid; grid-template-columns: 300px 1fr; gap: 1px; background: var(--border); margin-top: 14px; border-top: 1px solid var(--border); }
      .evals-radar { background: var(--panel); padding: 12px 18px; display: flex; align-items: center; justify-content: center; }
      .evals-cards { background: var(--panel); display: grid; grid-template-columns: repeat(4, 1fr); }
      .evals-cards .card { padding: 14px 18px; border-left: 1px solid var(--border); }
      .evals-cards .card:first-child { border-left: none; }
      .evals-cards .v.good { color: var(--green); } .evals-cards .v.warn { color: var(--orange); }
      .heat { width: 100%; border-collapse: collapse; font-size: 12px; }
      .heat th { text-align: center; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; padding: 10px 6px; border-bottom: 1px solid var(--border); }
      .heat th.task { text-align: left; padding-left: 18px; width: 30%; }
      .heat td { padding: 0; border-bottom: 1px solid #15151a; height: 34px; }
      .heat td.task { padding-left: 18px; font-family: var(--mono); font-size: 11.5px; color: var(--text); }
      .heat td.task .fl { color: var(--orange); font-size: 10px; margin-left: 8px; }
      .heat td.cell { text-align: center; }
      .heat td.cell .box { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 22px; border-radius: 4px; font-family: var(--mono); font-size: 12px; font-weight: 600; color: #0c0c0f; transition: background 0.4s; }
      .heat tr:hover td { background: #14141a; }
      .flagchip { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-family: var(--mono); border: 1px solid color-mix(in oklab, var(--orange), transparent 55%); color: var(--orange); }
      .radar-lbl { font-size: 10px; fill: var(--muted); font-family: var(--ui); }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand"><span class="bolt">⚡</span> agent-primitives <span class="sub">· profiler</span></div>
      <div class="runid" id="runid"></div>
      <div class="spacer"></div>
      <div class="live" id="live"><span class="dot"></span>LIVE</div>
      <div class="pill" id="durpill"></div>
      <div class="pill" id="statuspill"></div>
    </div>

    <div id="content"></div>

    <script>
      const KIND_COLOR = { turn: "#3a3a44", agent: "#0a84ff", model_call: "#32d74b", tool_call: "#ff9f0a", a2a_call: "#40c8e0" };
      const AGENT_COLORS = ["#0a84ff", "#bf5af2", "#40c8e0", "#ff6482", "#ffd60a", "#32d74b", "#ff9f0a"];

      let META = {}, SPANS = [], EVALS = [], selectedId = null;
      try { const p = JSON.parse(document.getElementById("ap-payload").textContent); META = p.meta || {}; SPANS = p.spans || []; EVALS = p.evals || []; } catch (e) {}
      const CRITERIA_ORDER = ["accuracy", "completeness", "source_quality", "process", "disclosure"];
      const CRIT_LABEL = { accuracy: "Accuracy", completeness: "Complete", source_quality: "Sources", process: "Process", disclosure: "Disclosure" };

      const ms = (s) => new Date(s).getTime();
      const dur = (s) => (s.endedAt ? ms(s.endedAt) : ms(s.startedAt)) - ms(s.startedAt);
      const fmtDur = (d) => (d >= 1000 ? (d / 1000).toFixed(2) + "s" : Math.round(d) + "ms");
      const fmtTok = (n) => (n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "K" : String(n));
      const fmtNum = (n) => n.toLocaleString("en-US");
      const fmtCost = (c) => "$" + (c >= 1 ? c.toFixed(2) : c.toFixed(4));
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      // ---- SVG helpers ----
      function pt(cx, cy, r, a) { const rad = (a - 90) * Math.PI / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)]; }
      function arc(cx, cy, r, a1, a2, w, color) {
        const [x1, y1] = pt(cx, cy, r, a1), [x2, y2] = pt(cx, cy, r, a2);
        const large = a2 - a1 > 180 ? 1 : 0;
        return `<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
      }
      // 270deg gauge: value 0..1 maps 225deg (lower-left) clockwise to 495deg (lower-right).
      function gauge() {
        // Needle is drawn at the baseline (lower-left, START); setGauge() rotates it via CSS by
        // frac*SWEEP - so the rotation both positions and animates it (no double-apply).
        const cx = 100, cy = 100, r = 78, START = 225, SWEEP = 270;
        const track = arc(cx, cy, r, START, START + SWEEP, 12, "#26262d");
        const zones =
          arc(cx, cy, r, START, START + SWEEP * 0.6, 12, "var(--green)") +
          arc(cx, cy, r, START + SWEEP * 0.6, START + SWEEP * 0.85, 12, "var(--yellow)") +
          arc(cx, cy, r, START + SWEEP * 0.85, START + SWEEP, 12, "var(--red)");
        const [nx, ny] = pt(cx, cy, r - 8, START);
        const needle = `<g class="needle"><line x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4.5" fill="#fff"/></g>`;
        return `<svg width="164" height="138" viewBox="0 0 200 168">${track}${zones}${needle}</svg>`;
      }
      function donut(parts) {
        const cx = 60, cy = 60, r = 44, w = 16, C = 2 * Math.PI * r;
        let off = 0, segs = "";
        const total = parts.reduce((a, p) => a + p.v, 0) || 1;
        for (const p of parts) {
          const len = (p.v / total) * C;
          segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${w}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
          off += len;
        }
        return `<svg width="120" height="120" viewBox="0 0 120 120">${segs}</svg>`;
      }
      function area(points, W, H, color) {
        if (!points.length) return `<svg viewBox="0 0 ${W} ${H}"></svg>`;
        const maxY = Math.max(1, ...points.map((p) => p.y));
        let d = `M0 ${H} `;
        for (const p of points) d += `L${p.x.toFixed(1)} ${(H - (p.y / maxY) * (H - 8)).toFixed(1)} `;
        d += `L${W} ${(H - (points[points.length - 1].y / maxY) * (H - 8)).toFixed(1)} L${W} ${H} Z`;
        return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs><linearGradient id="ag${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.45"/><stop offset="1" stop-color="${color}" stop-opacity="0.02"/></linearGradient></defs>
          <path d="${d}" fill="url(#ag${color.replace('#','')})" stroke="${color}" stroke-width="1.5"/></svg>`;
      }

      // Score 1..5 -> red→green (the eval heatmap / radar palette).
      const SCORE_STOPS = ["#ff453a", "#ff9f0a", "#ffd60a", "#7bd66a", "#32d74b"];
      function scoreColor(v) { return SCORE_STOPS[Math.max(1, Math.min(5, Math.round(v))) - 1]; }

      // Radar (spider) chart of average score per criterion, on a 0..5 scale.
      function radar(labels, values) {
        const cx = 110, cy = 108, R = 78, n = labels.length, MAX = 5;
        const ang = (i) => (-90 + (360 / n) * i) * Math.PI / 180;
        const at = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
        let grid = "";
        for (let ring = 1; ring <= MAX; ring++) {
          const pts = labels.map((_, i) => at(i, (ring / MAX) * R).map((x) => x.toFixed(1)).join(",")).join(" ");
          grid += `<polygon points="${pts}" fill="none" stroke="#26262d" stroke-width="1"/>`;
        }
        let axes = "", lbls = "";
        labels.forEach((lb, i) => {
          const [ex, ey] = at(i, R);
          axes += `<line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#26262d" stroke-width="1"/>`;
          const [lx, ly] = at(i, R + 14);
          const anchor = Math.abs(lx - cx) < 6 ? "middle" : lx > cx ? "start" : "end";
          lbls += `<text class="radar-lbl" x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}" text-anchor="${anchor}">${lb}</text>`;
        });
        const dpts = values.map((v, i) => at(i, (Math.max(0, Math.min(MAX, v)) / MAX) * R).map((x) => x.toFixed(1)).join(",")).join(" ");
        const dots = values.map((v, i) => { const [x, y] = at(i, (Math.max(0, Math.min(MAX, v)) / MAX) * R); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#0a84ff"/>`; }).join("");
        return `<svg width="300" height="220" viewBox="-46 0 300 220">${grid}${axes}<polygon points="${dpts}" fill="rgba(10,132,255,0.22)" stroke="#0a84ff" stroke-width="1.8"/>${dots}${lbls}</svg>`;
      }

      function renderEvals() {
        if (!EVALS.length) return "";
        // Criteria = known order first, then any extra keys seen.
        const seen = new Set();
        EVALS.forEach((e) => Object.keys(e.scores || {}).forEach((k) => seen.add(k)));
        const crit = [...CRITERIA_ORDER.filter((k) => seen.has(k)), ...[...seen].filter((k) => !CRITERIA_ORDER.includes(k))];
        const avgOf = (k) => { const vs = EVALS.map((e) => e.scores[k]).filter((v) => typeof v === "number"); return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : 0; };
        const critAvg = crit.map(avgOf);
        const allVals = EVALS.flatMap((e) => crit.map((k) => e.scores[k]).filter((v) => typeof v === "number"));
        const overall = allVals.length ? allVals.reduce((a, b) => a + b, 0) / allVals.length : 0;
        const passed = EVALS.filter((e) => crit.every((k) => (e.scores[k] ?? 0) >= 3)).length;
        const flagged = EVALS.filter((e) => e.flagForHumanReview || (e.structuralFlags && e.structuralFlags.length)).length;

        const cards = [
          { k: "Tasks judged", v: String(EVALS.length) },
          { k: "Avg score", v: overall.toFixed(1) + " / 5", cls: overall >= 4 ? "good" : overall >= 3 ? "" : "warn" },
          { k: "Pass rate", v: Math.round((passed / EVALS.length) * 100) + "%", cls: passed === EVALS.length ? "good" : "warn", sub: passed + " / " + EVALS.length + " all ≥ 3" },
          { k: "Flagged", v: String(flagged), cls: flagged ? "warn" : "good" },
        ];
        const head = `<tr><th class="task">Task</th>${crit.map((k) => `<th>${CRIT_LABEL[k] || esc(k)}</th>`).join("")}<th>Review</th></tr>`;
        const body = EVALS.map((e) => {
          const cells = crit.map((k) => { const v = e.scores[k]; return `<td class="cell">${typeof v === "number" ? `<span class="box" style="background:${scoreColor(v)}">${v}</span>` : "·"}</td>`; }).join("");
          const flags = (e.structuralFlags && e.structuralFlags.length) ? `<span class="fl">${esc(e.structuralFlags.join(", "))}</span>` : "";
          const chip = e.flagForHumanReview || (e.structuralFlags && e.structuralFlags.length) ? `<span class="flagchip">review</span>` : "";
          return `<tr><td class="task">${esc(e.taskId)}${flags}</td>${cells}<td class="cell">${chip}</td></tr>`;
        }).join("");

        return `<div class="section">
          <h2>Evals · LLM-as-judge · ${EVALS.length} judged</h2>
          <div class="evals-top">
            <div class="evals-radar">${radar(crit.map((k) => CRIT_LABEL[k] || k), critAvg)}</div>
            <div class="evals-cards">${cards.map((c) => `<div class="card"><div class="k">${c.k}</div><div class="v ${c.cls || ""}">${c.v}</div>${c.sub ? `<div class="sub">${c.sub}</div>` : '<div class="sub">&nbsp;</div>'}</div>`).join("")}</div>
          </div>
          <table class="heat"><thead>${head}</thead><tbody>${body}</tbody></table>
        </div>`;
      }

      // Clean display name: "lead:<uuid>" -> "lead", "citation:<uuid>-citation" -> "citation",
      // "subagent:sub-1" -> "sub-1". Strips the run/task UUID so labels stay short.
      function agentKey(s) {
        const name = s.name || "";
        const i = name.indexOf(":");
        if (i < 0) return name;
        const role = name.slice(0, i), id = name.slice(i + 1);
        return /[0-9a-f]{8}-[0-9a-f]{4}/.test(id) ? role : id;
      }

      function render() {
        const content = document.getElementById("content");
        const hasRun = SPANS.length > 0;
        if (!hasRun && !EVALS.length) { content.innerHTML = '<div class="empty">Waiting for data…</div>'; return; }
        document.getElementById("live").className = "live" + (META.live ? " on" : "");

        if (!hasRun) {
          // Eval-only dashboard (the eval suite): show the judge matrices, no run trace.
          const flagged = EVALS.filter((e) => e.flagForHumanReview || (e.structuralFlags && e.structuralFlags.length)).length;
          document.getElementById("runid").textContent = META.title || "eval suite";
          document.getElementById("durpill").textContent = EVALS.length + " tasks judged";
          const sp = document.getElementById("statuspill"); sp.textContent = flagged ? "review" : "ok"; sp.className = "pill " + (flagged ? "partial" : "ok");
          content.innerHTML = renderEvals();
          return;
        }

        const t0 = Math.min(...SPANS.map((s) => ms(s.startedAt)));
        const t1 = Math.max(...SPANS.map((s) => (s.endedAt ? ms(s.endedAt) : ms(s.startedAt))));
        const total = Math.max(1, t1 - t0);
        const model = SPANS.filter((s) => s.kind === "model_call");
        const tools = SPANS.filter((s) => s.kind === "tool_call");
        const agents = SPANS.filter((s) => s.kind === "agent");
        const tokIn = model.reduce((a, s) => a + ((s.tokenUsage && s.tokenUsage.inputTokens) || 0), 0);
        const tokOut = model.reduce((a, s) => a + ((s.tokenUsage && s.tokenUsage.outputTokens) || 0), 0);
        const tokens = tokIn + tokOut;
        const cost = SPANS.reduce((a, s) => a + (s.costUsd || 0), 0);
        const errors = SPANS.filter((s) => s.status === "error").length;
        const runStatus = errors ? "error" : SPANS.some((s) => s.status === "partial") ? "partial" : "ok";
        const tokBudget = META.tokenBudget || 250000;
        const costBudget = META.costBudget || Math.max(0.05, cost * 2);

        document.getElementById("runid").textContent = (META.runId || SPANS[0].traceId || "").slice(0, 8);
        const dp = document.getElementById("durpill"); dp.textContent = fmtDur(total) + " · " + SPANS.length + " spans";
        const sp = document.getElementById("statuspill"); sp.textContent = runStatus; sp.className = "pill " + runStatus;

        // token distribution by agent (group model_call by parent agent span)
        const byId = new Map(SPANS.map((s) => [s.spanId, s]));
        const dist = new Map();
        for (const m of model) {
          const parent = byId.get(m.parentSpanId);
          const key = parent ? agentKey(parent) : "unknown";
          const tk = ((m.tokenUsage && (m.tokenUsage.inputTokens + m.tokenUsage.outputTokens)) || 0);
          dist.set(key, (dist.get(key) || 0) + tk);
        }
        const distParts = [...dist.entries()].sort((a, b) => b[1] - a[1]).map(([k, v], i) => ({ k, v, c: AGENT_COLORS[i % AGENT_COLORS.length] }));

        // cumulative over-time series (by model call end time)
        const evs = model.map((s) => ({ x: ((ms(s.endedAt || s.startedAt) - t0) / total) * 1000, tok: ((s.tokenUsage && (s.tokenUsage.inputTokens + s.tokenUsage.outputTokens)) || 0), cost: s.costUsd || 0 })).sort((a, b) => a.x - b.x);
        let ct = 0, cc = 0; const tokSeries = evs.map((e) => ({ x: e.x, y: (ct += e.tok) })); const costSeries = evs.map((e) => ({ x: e.x, y: (cc += e.cost) }));
        const peakCall = Math.max(0, ...model.map((s) => (s.tokenUsage ? s.tokenUsage.inputTokens + s.tokenUsage.outputTokens : 0)));

        content.innerHTML = renderEvals() + `
          <div class="section">
            <div class="gauges">
              <div class="gpanel"><div class="gauge" id="g-tok"></div><div class="meta"><div class="title">Tokens used</div><div class="big">${fmtTok(tokens)}</div><div class="subline">${Math.round((tokens/tokBudget)*100)}% of ${fmtTok(tokBudget)} budget</div></div></div>
              <div class="gpanel"><div class="gauge" id="g-cost"></div><div class="meta"><div class="title">Estimated cost</div><div class="big">${fmtCost(cost)}</div><div class="subline">${cost === 0 ? "mock provider" : Math.round((cost/costBudget)*100) + "% of " + fmtCost(costBudget) + " cap"}</div></div></div>
              <div class="gpanel"><div class="gauge">${donut(distParts.length ? distParts : [{k:"none",v:1,c:"#26262d"}])}</div><div class="meta" style="flex:1"><div class="title">Token distribution</div><div class="donut-legend">${distParts.slice(0,5).map((p) => `<div class="li"><span class="sw" style="background:${p.c}"></span><span class="nm">${esc(p.k)}</span><span class="val">${fmtTok(p.v)}</span></div>`).join("") || '<div class="subline">no model calls yet</div>'}</div></div></div>
            </div>
          </div>

          <div class="section">
            <div class="overtime">
              <div class="otcard"><div class="stat"><div class="t">Tokens over time</div><div class="r"><b>${fmtNum(tokens)}</b> total<br/><b>${fmtNum(tokIn)}</b> in · <b>${fmtNum(tokOut)}</b> out<br/>peak call <b>${fmtNum(peakCall)}</b></div></div><div class="chart">${area(tokSeries, 1000, 92, "#32d74b")}</div></div>
              <div class="otcard"><div class="stat"><div class="t">Cost over time</div><div class="r"><b>${fmtCost(cost)}</b> total<br/><b>${model.length}</b> model calls<br/><b>${tools.length}</b> tool calls</div></div><div class="chart">${area(costSeries, 1000, 92, "#0a84ff")}</div></div>
            </div>
          </div>

          <div class="section">
            <h2>Agents · ${agents.length} spawned, depth ≤ ${Math.max(0, ...SPANS.map((s) => s.delegationDepth || 0))}</h2>
            <div class="tracks" id="tracks"></div>
          </div>

          <div class="section">
            <h2>Timeline</h2>
            <div class="details ${selectedId ? "on" : ""}" id="details"></div>
            <div class="twrap" id="twrap"></div>
            <div class="legend">
              <div class="li"><span class="dot" style="background:#3a3a44"></span>turn</div>
              <div class="li"><span class="dot" style="background:#0a84ff"></span>agent</div>
              <div class="li"><span class="dot" style="background:#32d74b"></span>model call</div>
              <div class="li"><span class="dot" style="background:#ff9f0a"></span>tool call</div>
              <div class="li"><span class="dot" style="background:#40c8e0"></span>a2a call</div>
              <div class="li"><span class="dot" style="background:#ff453a"></span>error</div>
              <div class="foot">${META.live ? "streaming live" : "static export"} · rendered offline</div>
            </div>
          </div>`;

        // gauges (needle rotation animates via CSS)
        setGauge("g-tok", tokens / tokBudget);
        setGauge("g-cost", costBudget ? cost / costBudget : 0);

        // agent tracks
        const tracksEl = document.getElementById("tracks");
        tracksEl.innerHTML = agents.map((a, i) => {
          const calls = model.filter((m) => m.parentSpanId === a.spanId);
          const tk = calls.reduce((s, m) => s + (m.tokenUsage ? m.tokenUsage.inputTokens + m.tokenUsage.outputTokens : 0), 0);
          const pts = calls.map((m) => ({ x: ((ms(m.startedAt) - t0) / total) * 1000, y: (m.tokenUsage ? m.tokenUsage.inputTokens + m.tokenUsage.outputTokens : 0) }));
          const c = AGENT_COLORS[i % AGENT_COLORS.length];
          return `<div class="trk"><div class="lab"><div class="n"><span class="dot" style="background:${c}"></span>${esc(agentKey(a))}</div><div class="s">${a.agentRole || ""} · ${fmtTok(tk)} tok</div></div><div class="spark">${area(pts, 1000, 30, c)}</div></div>`;
        }).join("");

        renderTimeline(t0, total);
        if (selectedId) select(selectedId, true);
      }

      function setGauge(id, frac) {
        const el = document.getElementById(id); if (!el) return;
        el.innerHTML = gauge();
        requestAnimationFrame(() => { const n = el.querySelector(".needle"); if (n) n.style.transform = `rotate(${Math.max(0, Math.min(1, frac)) * 270}deg)`; });
      }

      function renderTimeline(t0, total) {
        const byId = new Map(SPANS.map((s) => [s.spanId, s]));
        const children = new Map();
        for (const s of SPANS) { const p = s.parentSpanId || "__root__"; (children.get(p) || children.set(p, []).get(p)).push(s); }
        for (const arr of children.values()) arr.sort((a, b) => ms(a.startedAt) - ms(b.startedAt));
        const ordered = []; const walk = (pid, d) => { for (const s of children.get(pid) || []) { ordered.push({ s, d }); walk(s.spanId, d + 1); } };
        walk("__root__", 0);
        for (const s of SPANS) if (s.parentSpanId && !byId.has(s.parentSpanId) && !ordered.find((o) => o.s === s)) { ordered.push({ s, d: 0 }); walk(s.spanId, 1); }

        let axis = '<div class="axis">';
        for (let i = 0; i <= 6; i++) axis += `<div class="tick" style="left:${(i / 6) * 100}%"><span>${fmtDur((total * i) / 6)}</span></div>`;
        axis += "</div>";
        const LW = 210;
        const rows = ordered.map(({ s, d }) => {
          const left = ((ms(s.startedAt) - t0) / total) * 100;
          const width = Math.max(0.4, (dur(s) / total) * 100);
          const color = KIND_COLOR[s.kind] || "#666";
          const nm = s.kind === "agent" ? agentKey(s) : s.name.replace(/^(lead|subagent|citation|judge):/, "");
          const bl = s.kind === "tool_call" ? s.name : (s.kind === "model_call" && s.costUsd ? fmtCost(s.costUsd) : "");
          return `<div class="row" data-id="${s.spanId}"><div class="label" style="padding-left:${12 + d * 13}px"><span class="dot" style="background:${color}"></span>${esc(nm)}${s.agentRole ? `<span class="rl">${s.agentRole}</span>` : ""}</div><div class="lane" style="left:${LW}px"><div class="bar k-${s.kind} status-${s.status}" data-id="${s.spanId}" style="left:${left}%;width:${width}%" title="${esc(s.name)} · ${fmtDur(dur(s))}">${bl ? `<span class="bl">${esc(bl)}</span>` : ""}</div></div></div>`;
        }).join("");
        document.getElementById("twrap").innerHTML = axis + rows;
        document.querySelectorAll(".row").forEach((r) => r.addEventListener("click", () => select(r.dataset.id)));
      }

      function select(id, keep) {
        const s = SPANS.find((x) => x.spanId === id); if (!s) return;
        selectedId = id;
        document.querySelectorAll(".bar").forEach((b) => b.classList.toggle("sel", b.dataset.id === id));
        const tu = s.tokenUsage || {};
        const rows = [
          ["kind", s.kind], ["name", s.name], s.agentRole ? ["role", s.agentRole] : null,
          ["status", s.status, s.status === "error" ? "red" : s.status === "ok" ? "green" : ""],
          ["duration", fmtDur(dur(s))], ["depth", String(s.delegationDepth || 0)],
          tu.inputTokens != null ? ["tokens in", fmtNum(tu.inputTokens)] : null,
          tu.outputTokens != null ? ["tokens out", fmtNum(tu.outputTokens)] : null,
          tu.cachedInputTokens ? ["cached", fmtNum(tu.cachedInputTokens)] : null,
          s.costUsd != null ? ["cost", fmtCost(s.costUsd), "green"] : null,
          s.attributes && s.attributes.errorType ? ["error", String(s.attributes.errorType), "red"] : null,
        ].filter(Boolean);
        const el = document.getElementById("details");
        el.className = "details on";
        el.innerHTML = `<div class="kv">${rows.map(([k, v, c]) => `<div><div class="k">${k}</div><div class="v ${c || ""}">${esc(String(v))}</div></div>`).join("")}</div>`;
      }

      // ---- live mode ----
      let raf = null;
      function scheduleRender() { if (raf) return; raf = requestAnimationFrame(() => { raf = null; render(); }); }
      if (META.live && location.protocol.startsWith("http")) {
        const es = new EventSource("/events");
        es.addEventListener("span", (e) => { try { const s = JSON.parse(e.data); const i = SPANS.findIndex((x) => x.spanId === s.spanId); if (i >= 0) SPANS[i] = s; else SPANS.push(s); scheduleRender(); } catch (_) {} });
        es.addEventListener("eval", (e) => { try { const r = JSON.parse(e.data); const i = EVALS.findIndex((x) => x.taskId === r.taskId); if (i >= 0) EVALS[i] = r; else EVALS.push(r); scheduleRender(); } catch (_) {} });
        es.addEventListener("meta", (e) => { try { Object.assign(META, JSON.parse(e.data)); scheduleRender(); } catch (_) {} });
        es.addEventListener("done", () => { META.live = false; es.close(); scheduleRender(); });
      }
      render();
    </script>
  </body>
</html>
